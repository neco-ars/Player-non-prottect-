<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Заменяется значением --base-href при сборке (на GitHub Pages это /<имя репозитория>/). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Музыкальный плеер: Яндекс Музыка, SoundCloud и YouTube в одном поиске.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1c1b1f">

  <!-- iOS: запуск с экрана «Домой» как отдельное приложение -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Music Player">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Music Player</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #1c1b1f; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #cac4d0; font: 15px -apple-system, system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="loading">Загрузка…</div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
