name: Build

# Сборка при каждом пуше в main, при создании тега v* (тогда ещё и релиз) и вручную.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # нужно, чтобы выложить файлы в релиз
  pages: write # публикация веб-версии
  id-token: write

# Ключи приложения вшиваются при сборке из секретов репозитория (в коде их нет).
env:
  KEYS: >-
    --dart-define=YOUTUBE_KEY=${{ secrets.YOUTUBE_KEY }}
    --dart-define=GENIUS_TOKEN=${{ secrets.GENIUS_TOKEN }}
    --dart-define=AUDIOMACK_KEY=${{ secrets.AUDIOMACK_KEY }}
    --dart-define=AUDIOMACK_SECRET=${{ secrets.AUDIOMACK_SECRET }}
    --dart-define=LASTFM_KEY=${{ secrets.LASTFM_KEY }}
    --dart-define=PROXY_URL=${{ vars.PROXY_URL }}
    --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
    --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}

# Новая отправка в ту же ветку отменяет устаревшую сборку, а не ждёт её в очереди.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Веб-версия (GitHub Pages)
    # сайт публикуется только из main: GitHub Pages по умолчанию не принимает публикацию из тегов
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # адрес прокси берётся из переменной репозитория PROXY_URL (см. proxy/README.md)
      - run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          $KEYS
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v5

  ios:
    name: iPhone (.ipa без подписи)
    # Только при выпуске версии и необязательно: облачные Mac у GitHub бывают заняты часами,
    # а для iPhone есть веб-версия. Если Mac не нашёлся — релиз выйдет без .ipa.
    if: startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    timeout-minutes: 60
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign $KEYS
      # .ipa — это zip с папкой Payload/Runner.app. Подпись ставит Sideloadly/AltStore при установке.
      - name: Упаковать .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry music_player-ios.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: music_player-ios.ipa

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # постоянный ключ подписи из секретов: иначе каждая версия подписана новым ключом
      # и не ставится поверх предыдущей
      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::warning::Нет секрета ANDROID_KEYSTORE_BASE64 — APK подписан временным ключом"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: flutter build apk --release $KEYS
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk music_player-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: music_player-android.apk

  windows:
    name: Windows (.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # bash: список ключей должен разбиться на отдельные аргументы (в PowerShell он пришёл бы одной строкой)
      - run: flutter build windows --release $KEYS
        shell: bash
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath music_player-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: music_player-windows.zip

  release:
    name: Релиз
    # ждём и iPhone, но выпускаем релиз, даже если он не собрался
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success' && needs.windows.result == 'success' }}
    needs: [ios, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            music_player-ios.ipa
            music_player-android.apk
            music_player-windows.zip
